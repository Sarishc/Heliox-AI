name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install linters
        run: pip install black ruff

      - name: Black
        run: |
          cd backend
          black --check app tests

      - name: Ruff
        run: |
          cd backend
          ruff check app tests

  # ── Type check (advisory only) ────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install mypy
          pip install -r requirements.txt

      - name: mypy
        run: |
          cd backend
          mypy app --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # ── Unit tests ────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      # Throwaway server for the PostgreSQL-only tests (migrations, ON CONFLICT upserts);
      # each test creates and drops its own database in it
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # conftest.py uses SQLite in-memory for the app; PostgreSQL-only tests use the service above
      DATABASE_URL: "sqlite:///:memory:"
      HELIOX_MIGRATION_TEST_SERVER_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
      # Fail instead of skipping if the PostgreSQL tests ever lose their server
      HELIOX_REQUIRE_POSTGRES_TESTS: "1"
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      ENV: dev
      # Fernet key used for integration token encryption — generated for CI only
      INTEGRATIONS_ENCRYPTION_KEY: ${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}
      # Stripe stubs — tests don't call Stripe live, but settings validation requires them
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key_not_real
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_not_real
      ADMIN_API_KEY: ci-admin-key-for-unit-tests-only

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and production build
        run: pnpm --filter app build

      - name: API proxy unit tests
        run: pnpm --filter app test:unit

  # ── GPU agent: test, build image, publish on main ─────────────────────────────
  agent:
    name: GPU Agent
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test agent
        run: |
          pip install -r agent/requirements.txt pytest
          python -m pytest agent/tests -q

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/heliox-agent" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build agent image (push on main)
        uses: docker/build-push-action@v5
        with:
          context: ./agent
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  # ── Dependency audit ──────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit
        run: |
          pip install pip-audit
          cd backend
          pip-audit -r requirements.txt --desc
        continue-on-error: true

  # ── Security scan ─────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Blocking: a fixable CRITICAL/HIGH vulnerability or a detected secret fails the job.
      # Reviewed false positives live in .trivyignore.yaml (see docs/SECURITY_SCANNING.md).
      - name: Trivy repository scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.76.1"
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"
          exit-code: "1"

      # Report only: every CRITICAL/HIGH vulnerability, including advisories with no fix yet
      - name: Trivy repository report (incl. unfixed)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.76.1"
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  # ── Docker build ──────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: heliox-api:${{ github.sha }}
          cache-from: type=gha
          # A failed cache upload (e.g. "error writing layer blob") shouldn't fail a good build
          cache-to: type=gha,mode=max,ignore-error=true

      # Blocking: a fixable CRITICAL/HIGH vulnerability or a secret in the runtime image fails the job
      - name: Trivy image scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.76.1"
          image-ref: "heliox-api:${{ github.sha }}"
          scanners: "vuln,secret"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore.yaml"
          exit-code: "1"

      # Report only: every CRITICAL/HIGH vulnerability, including unfixed OS advisories
      - name: Trivy image report (incl. unfixed)
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.76.1"
          image-ref: "heliox-api:${{ github.sha }}"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      # Code scanning (Security tab). Reporting only: it never decides the gate above.
      - name: Trivy image SARIF
        if: success() || failure()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: "v0.76.1"
          image-ref: "heliox-api:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: success() || failure()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ── Integration tests (Docker Compose stack) ──────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Create backend .env
        run: |
          cat > backend/.env <<EOF
          SECRET_KEY=ci-$(openssl rand -hex 32)
          ADMIN_API_KEY=ci-admin-$(openssl rand -hex 24)
          ENV=dev
          DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/heliox
          REDIS_URL=redis://redis:6379/0
          INTEGRATIONS_ENCRYPTION_KEY=${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}
          STRIPE_SECRET_KEY=sk_test_ci_dummy_key_not_real
          STRIPE_WEBHOOK_SECRET=whsec_ci_dummy_not_real
          EOF

      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d postgres redis api

      - name: Wait for API
        run: |
          ready=false
          for i in $(seq 1 60); do
            if curl --max-time 5 -sf http://localhost:8000/health; then
              echo " API ready"
              ready=true
              break
            fi
            echo "Attempt $i/60 — waiting..."
            sleep 2
          done
          if [[ "$ready" != "true" ]]; then
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs api
            exit 1
          fi

      - name: Run migrations
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api alembic upgrade head

      - name: Smoke tests
        run: |
          curl --retry 5 --retry-all-errors -sf http://localhost:8000/health
          curl --retry 5 --retry-all-errors -sf http://localhost:8000/ready
          curl --retry 5 --retry-all-errors -sf http://localhost:8000/metrics > /tmp/heliox-metrics.txt
          head -5 /tmp/heliox-metrics.txt

      - name: Seed demo data
        run: |
          ADMIN_KEY=$(grep ADMIN_API_KEY backend/.env | cut -d= -f2-)
          curl -sf -X POST "http://localhost:8000/api/v1/admin/demo/seed" \
            -H "X-API-Key: ${ADMIN_KEY}" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('Seed OK — team_id:', d.get('team_id', 'unknown'))
          "
