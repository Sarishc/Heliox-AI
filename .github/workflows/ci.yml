name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install linters
        run: pip install black ruff

      - name: Black
        run: |
          cd backend
          black --check app tests

      - name: Ruff
        run: |
          cd backend
          ruff check app tests

  # ── Type check (advisory only) ────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install mypy
          pip install -r requirements.txt

      - name: mypy
        run: |
          cd backend
          mypy app --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # ── Unit tests ────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # conftest.py uses SQLite in-memory — no Postgres service needed for unit tests
      DATABASE_URL: "sqlite:///:memory:"
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      ENV: dev
      # Fernet key used for integration token encryption — generated for CI only
      INTEGRATIONS_ENCRYPTION_KEY: ${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}
      # Stripe stubs — tests don't call Stripe live, but settings validation requires them
      STRIPE_SECRET_KEY: sk_test_ci_dummy_key_not_real
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy_not_real
      ADMIN_API_KEY: ci-admin-key-for-unit-tests-only

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd backend
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and production build
        run: pnpm --filter app build

  # ── Dependency audit ──────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip-audit
        run: |
          pip install pip-audit
          cd backend
          pip-audit -r requirements.txt --desc
        continue-on-error: true

  # ── Security scan ─────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
        continue-on-error: true

  # ── Docker build ──────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: heliox-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "heliox-api:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ── Integration tests (Docker Compose stack) ──────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Create backend .env
        run: |
          cat > backend/.env <<EOF
          SECRET_KEY=ci-$(openssl rand -hex 32)
          ADMIN_API_KEY=ci-admin-$(openssl rand -hex 24)
          ENV=dev
          DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/heliox
          REDIS_URL=redis://redis:6379/0
          INTEGRATIONS_ENCRYPTION_KEY=${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}
          STRIPE_SECRET_KEY=sk_test_ci_dummy_key_not_real
          STRIPE_WEBHOOK_SECRET=whsec_ci_dummy_not_real
          EOF

      - name: Start services
        run: docker compose up -d postgres redis api

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && echo " API ready" && break
            echo "Attempt $i/60 — waiting..."
            sleep 2
          done

      - name: Run migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Smoke tests
        run: |
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/ready
          curl -sf http://localhost:8000/metrics | head -5

      - name: Seed demo data
        run: |
          ADMIN_KEY=$(grep ADMIN_API_KEY backend/.env | cut -d= -f2-)
          curl -sf -X POST "http://localhost:8000/api/v1/admin/demo/seed" \
            -H "X-API-Key: ${ADMIN_KEY}" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('Seed OK — team_id:', d.get('team_id', 'unknown'))
          "
