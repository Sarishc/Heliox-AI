name: Publish Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"

permissions:
  contents: write
  pages: write

jobs:
  lint-and-test:
    name: Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Add Bitnami repo (for redis dependency)
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Update chart dependencies
        run: helm dependency update charts/heliox

      - name: Lint chart
        run: |
          helm lint charts/heliox \
            --set secrets.secretKey="$(openssl rand -hex 32)" \
            --set secrets.databasePassword="testpassword" \
            --set secrets.encryptionKey="dGVzdC1rZXktMzItY2hhcnMtbG9uZ3h4eHh4eHh4eA==" \
            --set postgresql.external.host="postgres.example.com" \
            --set redis.enabled=false \
            --set config.redisUrl="redis://redis.example.com:6379" \
            --set config.corsOrigins="https://app.example.com" \
            --strict

      - name: Template smoke test
        run: |
          helm template heliox charts/heliox \
            --set secrets.secretKey="$(openssl rand -hex 32)" \
            --set secrets.databasePassword="testpassword" \
            --set secrets.encryptionKey="dGVzdC1rZXktMzItY2hhcnMtbG9uZ3h4eHh4eHh4eA==" \
            --set postgresql.external.host="postgres.example.com" \
            --set redis.enabled=false \
            --set config.redisUrl="redis://redis.example.com:6379" \
            --set config.corsOrigins="https://app.example.com" \
            > /tmp/rendered.yaml

          # Verify migrations Job has correct hook annotations
          grep -A5 'heliox-migrations' /tmp/rendered.yaml | grep 'helm.sh/hook'

          # Verify agent DaemonSet has nodeSelector
          grep -A10 'kind: DaemonSet' /tmp/rendered.yaml | grep 'accelerator'

          echo "Template smoke test passed"

  release:
    name: Package & Publish
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: charts
          config: .cr.yaml
