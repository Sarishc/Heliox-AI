{{- if .Values.agent.enabled }}
## The agent DaemonSet runs the heliox-agent image (agent/Dockerfile) on every GPU node.
## It samples GPU utilization with NVML and reports busy GPU-hours to the Heliox API.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "heliox.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heliox.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "heliox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "heliox.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
      {{- with .Values.agent.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "heliox.fullname" . }}-agent
      {{- with .Values.agent.runtimeClassName }}
      ## e.g. "nvidia" on clusters where the NVIDIA runtime isn't the default
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ include "heliox.imageRepository" (dict "repo" .Values.agent.image.repository "global" .Values.global) }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ## The image's entrypoint is heliox_agent.py; the API key comes from HELIOX_API_KEY, never args
          args:
            - --endpoint
            - {{ required "agent.apiEndpoint is required" .Values.agent.apiEndpoint | quote }}
            - --interval
            - {{ .Values.agent.interval | quote }}
            {{- with .Values.agent.provider }}
            - --provider
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.agent.sendCosts }}
            - --send-costs
            {{- end }}
          env:
            - name: HELIOX_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- if .Values.agent.existingSecret }}
                  name: {{ .Values.agent.existingSecret }}
                  {{- else }}
                  name: {{ include "heliox.fullname" . }}-agent-secret
                  {{- end }}
                  key: api_key
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            ## Expose every GPU's NVML to the agent without requesting a nvidia.com/gpu resource
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- with .Values.agent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
## Secret holding the agent API key
{{- if not .Values.agent.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heliox.fullname" . }}-agent-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heliox.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
data:
  api_key: {{ .Values.agent.apiKey | b64enc | quote }}
{{- end }}
{{- end }}
