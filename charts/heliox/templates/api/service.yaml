apiVersion: v1
kind: Service
metadata:
  name: {{ include "heliox.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heliox.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "heliox.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
