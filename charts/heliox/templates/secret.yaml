{{- if not .Values.secrets.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "heliox.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heliox.labels" . | nindent 4 }}
  annotations:
    ## Prevent accidental deletion; remove annotation to allow helm uninstall cleanup
    helm.sh/resource-policy: keep
type: Opaque
data:
  ## JWT signing key — openssl rand -hex 32
  SECRET_KEY: {{ .Values.secrets.secretKey | b64enc | quote }}

  ## PostgreSQL password
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | b64enc | quote }}

  ## Redis password (empty string when auth disabled)
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}

  ## Fernet key for OAuth token encryption at rest
  INTEGRATIONS_ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | b64enc | quote }}

  ## Stripe
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | b64enc | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | b64enc | quote }}

  ## Google OAuth
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | b64enc | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | b64enc | quote }}

  ## Observability
  SENTRY_DSN: {{ .Values.secrets.sentryDsn | b64enc | quote }}

  ## Notifications
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | b64enc | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | b64enc | quote }}

  ## hCaptcha
  HCAPTCHA_SECRET_KEY: {{ .Values.secrets.hcaptchaSecretKey | b64enc | quote }}

  ## Admin API key
  ADMIN_API_KEY: {{ .Values.secrets.adminApiKey | b64enc | quote }}
{{- end }}
