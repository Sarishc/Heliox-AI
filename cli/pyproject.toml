[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heliox-cli"
version = "0.1.0"
description = "CLI for Heliox GPU cost visibility platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["gpu", "mlops", "finops", "kubernetes", "cli"]
authors = [
    {name = "Heliox Team", email = "engineering@heliox.ai"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "keyring>=24.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
    "respx>=0.20.0",
]

[project.scripts]
heliox = "heliox_cli.main:app"

[project.urls]
Homepage = "https://heliox.ai"
Documentation = "https://docs.heliox.ai/cli"
Repository = "https://github.com/heliox-ai/heliox"
"Bug Tracker" = "https://github.com/heliox-ai/heliox/issues"

[tool.hatch.build.targets.wheel]
packages = ["heliox_cli"]
