version: '3.9'

# Production Docker Compose Configuration
# WARNING: This file should NOT be used as-is. You must:
# 1. Set all environment variables via .env file (not committed to git)
# 2. Use managed databases in production (RDS, Cloud SQL, etc.)
# 3. Configure proper monitoring and backups

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: heliox-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heliox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: heliox
      POSTGRES_INITDB_ARGS: "-E UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heliox} -d heliox"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - heliox-network
    restart: always
    # Production: Use managed PostgreSQL (RDS, Cloud SQL) instead
    # This is for self-hosted deployments only

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: heliox-redis-prod
    command: >
      redis-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - heliox-network
    restart: always
    # Production: Use managed Redis (ElastiCache, Upstash) instead

  # FastAPI Backend
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heliox-api-prod
    environment:
      # Application
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # Security (REQUIRED - no defaults)
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      
      # Database (use managed service in production)
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-heliox}:${POSTGRES_PASSWORD}@postgres:5432/heliox
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      
      # CORS (REQUIRED - must match your frontend domain)
      CORS_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      
      # Multi-tenancy (always enabled for SaaS)
      MULTI_TENANT: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heliox-network
    restart: always
    # Production: Run with multiple workers, no --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heliox-worker-prod
    environment:
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-heliox}:${POSTGRES_PASSWORD}@postgres:5432/heliox
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MULTI_TENANT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heliox-network
    restart: always
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 --max-tasks-per-child=1000

  # Celery Beat (Scheduler)
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heliox-beat-prod
    environment:
      ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-heliox}:${POSTGRES_PASSWORD}@postgres:5432/heliox
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MULTI_TENANT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - celery_beat_data:/app/data
    networks:
      - heliox-network
    restart: always
    command: celery -A app.celery_app beat --loglevel=info

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celery_beat_data:
    driver: local

networks:
  heliox-network:
    driver: bridge

# Production Deployment Notes:
#
# 1. Create .env file with all required variables:
#    - SECRET_KEY (generate with: openssl rand -base64 32)
#    - ADMIN_API_KEY (generate with: openssl rand -base64 32)
#    - POSTGRES_PASSWORD (strong password)
#    - REDIS_PASSWORD (strong password)
#    - CORS_ORIGINS (JSON array of allowed domains)
#
# 2. Run: docker-compose -f docker-compose.prod.yml up -d
#
# 3. Apply migrations: docker-compose -f docker-compose.prod.yml exec api alembic upgrade head
#
# 4. Create first team: See DEPLOYMENT_GUIDE.md
#
# 5. For production, strongly recommend using:
#    - Managed PostgreSQL (AWS RDS, GCP Cloud SQL, Railway Postgres)
#    - Managed Redis (AWS ElastiCache, Upstash, Railway Redis)
#    - Container orchestration (AWS ECS, GCP Cloud Run, Railway)
